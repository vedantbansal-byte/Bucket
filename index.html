<script>
  // Google Spreadsheet Published Key
  const PUB_ID = "2PACX-1vQ9jVeiYEHpUNlySSg9FtWGlVzuf0BGrdNMNJ0VUmJ--Sge9FrL36iUJkHbE9XRRSOtNq37PWykStMT";

  const metabaseQueries = [
    { name: "Facebook PnL", type: "fb_pnl", id: 7240 },
    { name: "Product PnL", type: "standard", id: 5087 },
    { name: "Product PnL SKU level", type: "sku_level", id: 5089 },
    { name: "Campaign PnL", type: "state_start_end", id: 5058 },
    { name: "State PnL", type: "state_start_end", id: 5058 },
    { name: "Tier", type: "tier_dist", id: 5097 },
    { name: "City", type: "city_dist", id: 5099 },
    { name: "Payment Mode", type: "payment_mode", id: 5101 },
    { name: "Platform", type: "platform", id: 5105 },
    { name: "Product mix", type: "product_mix", id: 5108 },
    { name: "Age", type: "start_end_seller", id: 5148 },
    { name: "Gender", type: "start_end_seller", id: 5150 },
    { name: "Comparision", type: "comparison", id: 438 },
    { name: "Campaign And State PnL", type: "camp_state", id: 93 },
    { name: "523", type: "seller_only", id: 523 },
    { name: "City Wise RTO", type: "end_seller_start", id: 266 },
    { name: "State PnL - Campaign Split", type: "campaign_split", id: 4411 }
  ];

  function fetchCSVData() {
    const syncStatus = document.getElementById('syncStatus');
    if (syncStatus) syncStatus.innerText = "(Fetching latest Google Sheet data...)";

    // Use Google Visualization JSON endpoint which supports full cross-origin response parsing
    const gvizUrl = `https://docs.google.com/spreadsheets/d/e/${PUB_ID}/gviz/tq?tqx=out:json`;

    fetch(gvizUrl)
      .then(res => res.text())
      .then(text => {
        // Extract raw JSON payload from Google's response wrapper
        const jsonMatch = text.match(/google\.visualization\.Query\.setResponse\(([\s\S]*)\);/);
        if (!jsonMatch) throw new Error("Invalid response structure from Google Sheets");

        const data = JSON.parse(jsonMatch[1]);
        if (!data.table || !data.table.rows) throw new Error("Empty dataset returned");

        // Extract headers and data rows
        const headers = data.table.cols.map(col => col ? (col.label || col.id) : '');
        const rows = data.table.rows.map(row => 
          row.c.map(cell => cell ? (cell.f !== undefined ? cell.f : (cell.v !== null ? cell.v : '')) : '')
        );

        const fullTable = [headers, ...rows];
        const formattedText = fullTable.map(r => r.join('\t')).join('\n');

        document.getElementById("rawSheetPaste").value = formattedText;
        if (syncStatus) syncStatus.innerText = "(Live sync active)";
        parseSheetData();
      })
      .catch(err => {
        console.error("GVIZ JSON Fetch Failed:", err);
        if (syncStatus) syncStatus.innerText = "(Sync failed: Paste rows directly into the box below)";
      });
  }

  function fetchDailyQuote() {
    const fallbackQuotes = [
      "“Success is not final, failure is not fatal: it is the courage to continue that counts.” — Winston Churchill",
      "“Do what you can with all you have, wherever you are.” — Theodore Roosevelt",
      "“Quality means doing it right when no one is looking.” — Henry Ford"
    ];
    fetch('https://api.allorigins.win/raw?url=' + encodeURIComponent('https://zenquotes.io/api/today'))
      .then(res => res.json())
      .then(data => {
        if(data && data[0] && data[0].q) {
          document.getElementById('dailyQuote').innerText = `“${data[0].q}” — ${data[0].a}`;
        } else { throw new Error(); }
      })
      .catch(() => {
        const randomFallback = fallbackQuotes[Math.floor(Math.random() * fallbackQuotes.length)];
        document.getElementById('dailyQuote').innerText = randomFallback;
      });
  }

  function setAutoLastWeekDateRange() {
    const today = new Date();
    const dayOfWeek = today.getDay();
    
    const lastSunday = new Date(today);
    const distanceToLastSunday = dayOfWeek === 0 ? 7 : dayOfWeek;
    lastSunday.setDate(today.getDate() - distanceToLastSunday);

    const lastMonday = new Date(lastSunday);
    lastMonday.setDate(lastSunday.getDate() - 6);

    const formatDate = (d) => d.toISOString().split('T')[0];

    const sDate = formatDate(lastMonday);
    const eDate = formatDate(lastSunday);
    const cDate = formatDate(today);

    document.getElementById('startDateInput').value = sDate;
    document.getElementById('endDateInput').value = eDate;
    document.getElementById('mb-val-curr-date').innerText = cDate;

    updateMetabaseLinks();
  }

  function updateMetabaseLinks() {
    const sellerId = document.getElementById('globalSellerIdInput').value.trim();
    const sDate = document.getElementById('startDateInput').value;
    const eDate = document.getElementById('endDateInput').value;

    document.getElementById('mb-val-curr-start').innerText = sDate || '-';
    document.getElementById('mb-val-curr-end').innerText = eDate || '-';

    const container = document.getElementById('metabaseCardsContainer');
    container.innerHTML = "";

    metabaseQueries.forEach(item => {
      let url = "";
      const base = `https://metabase.kaip.in/question/${item.id}`;
      const dashBase = `https://metabase.kaip.in/dashboard/${item.id}`;

      switch(item.type) {
        case 'fb_pnl':
          url = `${base}-facebook-seller-pnl-all-sellers-with-seller-filter?seller_id=${sellerId}&req_year=&req_week=&week_start_date=${sDate}`;
          break;
        case 'standard':
          url = `${base}-product-pnl-meta?product_id=&seller_id=${sellerId}&start_date=${sDate}&end_date=${eDate}&sku_id=`;
          break;
        case 'sku_level':
          url = `${base}-product-level-pnl-sku-level-meta?start_date=${sDate}&end_date=${eDate}&seller_id=${sellerId}&sku_id=&product_id=`;
          break;
        case 'state_start_end':
          url = `${base}-state-pnl-meta?seller_id=${sellerId}&state=&Start_date=${sDate}&End_date=${eDate}`;
          break;
        case 'tier_dist':
          url = `${base}-tier-wise-distribution-and-conversion-meta?start_date=${sDate}&end_date=${eDate}&seller_id=${sellerId}`;
          break;
        case 'city_dist':
          url = `${base}-city-wise-distribution-and-conversion-meta?seller_id=${sellerId}&State=&start_date=${sDate}&end_date=${eDate}&city=`;
          break;
        case 'payment_mode':
          url = `${base}-payment-mode-wise-distribution-and-conversion-meta?seller_id=${sellerId}&start_date=${sDate}&end_date=${eDate}`;
          break;
        case 'platform':
          url = `${base}-platform-wise-distribution-and-conversion-meta?seller_id=${sellerId}&start_date=${sDate}&end_date=${eDate}`;
          break;
        case 'start_end_seller':
          url = `${base}?seller_id=${sellerId}&start_date=${sDate}&end_date=${eDate}`;
          break;
        case 'product_mix':
          url = `${base}-product-mix-change-meta?date_range_1_start_date=${sDate}&date_range_1_end_date=${eDate}&seller_id=${sellerId}&date_range_2_start_date=&date_range_2_end_date=`;
          break;
        case 'comparison':
          url = `${dashBase}-comparison-with-profitable-period?current_period_end=${eDate}&current_period_start=${sDate}&profitable_period_end=${eDate}&profitable_period_start=${sDate}&seller_id=${sellerId}&tab=43-lp-partner%2C-tier-split%2C-payment-mode%2C-coupon-pnl`;
          break;
        case 'camp_state':
          url = `${dashBase}/93-campaign-and-state-p-l?end_date=${eDate}&seller_id=${sellerId}&start_date=${sDate}`;
          break;
        case 'seller_only':
          url = `${dashBase}/523?seller_id=${sellerId}`;
          break;
        case 'end_seller_start':
          url = `${dashBase}/266-city-wise-rto?end_date=${eDate}&seller_id=${sellerId}&start_date=${sDate}`;
          break;
        case 'campaign_split':
          url = `${base}?Start_date=${sDate}&End_date=${eDate}&seller_id=${sellerId}&utm_source=&state=&campaign_id=`;
          break;
        default:
          url = `${base}?seller_id=${sellerId}&start_date=${sDate}&end_date=${eDate}`;
      }

      const cardHtml = `
        <div class="metabase-link-card">
          <div>
            <h4 style="font-size:13px; font-weight:700; color:var(--text-main);">${item.name}</h4>
            <p style="font-size:10px; color:var(--text-muted); word-break: break-all;">${url}</p>
          </div>
          <a href="${url}" target="_blank" class="btn-open">Open ↗</a>
        </div>`;
      container.innerHTML += cardHtml;
    });
  }

  function goToMetabaseForSeller(sellerId) {
    if (!sellerId || sellerId === '-') return;
    document.getElementById('globalSellerIdInput').value = sellerId;
    updateMetabaseLinks();
    switchTab('metabase');
  }

  function cleanNum(val) {
    if (val === undefined || val === null) return 0;
    const str = val.toString().replace(/[^0-9.-]+/g, "");
    const parsed = parseFloat(str);
    return isNaN(parsed) ? 0 : parsed;
  }

  function fmtINR(val) {
    return "₹" + Math.round(val).toLocaleString('en-IN');
  }

  function getTsBadgeStyle(status) {
    const s = status.toLowerCase();
    if (s.includes('submitted')) {
      return 'background:#D1FAE5; color:#059669;';
    } else if (s.includes('google')) {
      return 'background:#FEF3C7; color:#D97706;';
    } else {
      return 'background:#F1F5F9; color:#64748B;';
    }
  }

  function clearPastedData() {
    localStorage.removeItem("saved_sheet_data");
    const pasteArea = document.getElementById("rawSheetPaste");
    pasteArea.value = "";
    pasteArea.classList.remove('submerged');
    location.reload();
  }

  function parseSheetData() {
    const pasteArea = document.getElementById("rawSheetPaste");
    const rawText = pasteArea.value.trim();
    if (!rawText) return;

    localStorage.setItem("saved_sheet_data", rawText);

    const lines = rawText.split('\n');
    const rawParsedRows = lines.map(line => line.includes('\t') ? line.split('\t') : line.split(','));

    if (rawParsedRows.length < 2) return;
    pasteArea.classList.add('submerged');

    const headers = rawParsedRows[0].map(h => h.trim().toLowerCase().replace(/[^a-z0-9%]/g, ''));
    
    let colMap = {
      sId: -1, sName: -1, cat: -1, adAcc: -1, web: -1, ts: -1, action: -1,
      startB: -1, currB: -1, weekT: -1, unplan: -1, scaleupP: -1, scaledownP: -1
    };

    headers.forEach((h, idx) => {
      if (h.includes('sellerid') || h === 'id') colMap.sId = idx;
      else if (h.includes('sellername') || h === 'seller') colMap.sName = idx;
      else if (h.includes('category')) colMap.cat = idx;
      else if (h.includes('adaccount')) colMap.adAcc = idx;
      else if (h.includes('website')) colMap.web = idx;
      else if (h.includes('tsstatus') || h === 'ts') colMap.ts = idx;
      else if (h.includes('action')) colMap.action = idx;
      else if (h.includes('startofweek') || h.includes('startweek') || h.includes('startbudget')) colMap.startB = idx;
      else if (h.includes('currentbudget') || h.includes('currbudget')) colMap.currB = idx;
      else if (h.includes('weektarget') || h.includes('target')) colMap.weekT = idx;
      else if (h.includes('unplannedscaledown') || h.includes('unplanned')) colMap.unplan = idx;
      else if (h.includes('plannedscaleuppending') || h.includes('scaleuppending')) colMap.scaleupP = idx;
      else if (h.includes('plannedscaledownpending') || h.includes('scaledownpending')) colMap.scaledownP = idx;
    });

    if (colMap.sId === -1) colMap.sId = 0;
    if (colMap.sName === -1) colMap.sName = 1;
    if (colMap.cat === -1) colMap.cat = 2;
    if (colMap.adAcc === -1) colMap.adAcc = 3;
    if (colMap.web === -1) colMap.web = 4;
    if (colMap.ts === -1) colMap.ts = 5;
    if (colMap.action === -1) colMap.action = 6;
    if (colMap.startB === -1) colMap.startB = 8;
    if (colMap.currB === -1) colMap.currB = 9;
    if (colMap.weekT === -1) colMap.weekT = 10;
    if (colMap.unplan === -1) colMap.unplan = 11;
    if (colMap.scaleupP === -1) colMap.scaleupP = 12;
    if (colMap.scaledownP === -1) colMap.scaledownP = 13;

    const dataRows = rawParsedRows.slice(1);
    let sumStartBudget = 0, sumCurrBudget = 0, sumWeekTarget = 0;
    let sumUnplanned = 0, sumScaleupP = 0, sumScaledownP = 0;
    let tsSubmittedCount = 0;
    let actionCompletedCount = 0;

    let tableHtml = "";
    let unplannedListHtml = "";
    let scaleupListHtml = "";
    let scaledownPendingListHtml = "";

    let countUnplanned = 0, countScaleup = 0, countScaledownP = 0;
    let validRowCount = 0;
    let firstValidRow = null;

    dataRows.forEach((row) => {
      const sId = (row[colMap.sId] || "").trim();
      const sName = (row[colMap.sName] || "").trim();

      if (!sId && (!sName || sName.toLowerCase() === 'unknown')) return;
      if (sName.toLowerCase() === 'unknown' && (!sId || sId === '-')) return;
      if (sName.toLowerCase().includes('total') || sId.toLowerCase().includes('total')) return;

      validRowCount++;
      if (!firstValidRow) firstValidRow = row;

      const cat = row[colMap.cat] || "-";
      const adAcc = row[colMap.adAcc] || "-";
      const web = row[colMap.web] || "#";
      const ts = (row[colMap.ts] || "Pending").trim();
      const action = (row[colMap.action] || "Pending").trim();

      const startB = cleanNum(row[colMap.startB]);
      const currB = cleanNum(row[colMap.currB]);
      const weekT = cleanNum(row[colMap.weekT]);
      
      const unplan = cleanNum(row[colMap.unplan]);
      const scaleP = cleanNum(row[colMap.scaleupP]);
      const scaledownP = cleanNum(row[colMap.scaledownP]);

      sumStartBudget += startB;
      sumCurrBudget += currB;
      sumWeekTarget += weekT;

      sumUnplanned += unplan;
      sumScaleupP += scaleP;
      sumScaledownP += scaledownP;

      if (ts.toLowerCase().includes("submitted")) tsSubmittedCount++;
      if (action.toLowerCase().includes("completed")) actionCompletedCount++;

      const tsStyle = getTsBadgeStyle(ts);

      let currBudgetColor = "var(--text-main)";
      if (currB > weekT) {
        currBudgetColor = "#10B981";
      } else if (currB < weekT) {
        currBudgetColor = "#EF4444";
      }

      if (unplan !== 0) {
        countUnplanned++;
        unplannedListHtml += `
          <li class="doodle-list-item">
            <span><b>${sName || 'Unknown'}</b> <small style="color:var(--text-muted);">(${sId || '-'})</small></span>
            <span style="color:var(--funky-pink);">${fmtINR(unplan)}</span>
          </li>`;
      }

      if (scaleP > 0) {
        countScaleup++;
        scaleupListHtml += `
          <li class="doodle-list-item">
            <span><b>${sName || 'Unknown'}</b> <small style="color:var(--text-muted);">(${sId || '-'})</small></span>
            <span style="color:var(--funky-green);">+${fmtINR(scaleP)}</span>
          </li>`;
      }

      if (scaledownP !== 0) {
        countScaledownP++;
        scaledownPendingListHtml += `
          <li class="doodle-list-item">
            <span><b>${sName || 'Unknown'}</b> <small style="color:var(--text-muted);">(${sId || '-'})</small></span>
            <span style="color:var(--funky-orange);">${fmtINR(scaledownP)}</span>
          </li>`;
      }

      tableHtml += `<tr>
        <td>${sId || '-'}</td>
        <td><b>${sName || 'Unknown'}</b></td>
        <td>${cat}</td>
        <td>${adAcc}</td>
        <td><a href="${web}" target="_blank" style="color:var(--funky-purple); font-weight:800;">Link ↗</a></td>
        <td><span class="status-badge" style="${tsStyle}">${ts}</span></td>
        <td><span class="status-badge" style="${action.toLowerCase() === 'completed' ? 'background:#D1FAE5; color:#059669;' : 'background:#FEE2E2; color:#EF4444;'}">${action}</span></td>
        <td style="text-align: right; color:${currBudgetColor}; font-weight:800;">${fmtINR(currB)}</td>
        <td style="text-align: right; color:var(--text-main); font-weight:800;">${fmtINR(weekT)}</td>
        <td style="text-align: right;">
          <button class="btn-metabase-go" onclick="goToMetabaseForSeller('${sId}')">➔ Metabase</button>
        </td>
      </tr>`;
    });

    if (firstValidRow) {
      if (!document.getElementById('globalSellerIdInput').value) {
        document.getElementById('globalSellerIdInput').value = firstValidRow[colMap.sId] || '';
        updateMetabaseLinks();
      }
    }

    document.getElementById('m-start-budget').innerText = fmtINR(sumStartBudget);
    document.getElementById('m-curr-budget').innerText = fmtINR(sumCurrBudget);
    document.getElementById('m-week-target').innerText = fmtINR(sumWeekTarget);
    document.getElementById('m-unplanned').innerText = fmtINR(sumUnplanned);
    document.getElementById('m-scaleup-p').innerText = fmtINR(sumScaleupP);
    document.getElementById('m-total-sellers').innerText = validRowCount;
    
    const tsPercentage = validRowCount > 0 ? ((tsSubmittedCount / validRowCount) * 100).toFixed(1) : '0';
    const actionPercentage = validRowCount > 0 ? ((actionCompletedCount / validRowCount) * 100).toFixed(1) : '0';

    document.getElementById('m-ts-rate').innerText = `${tsPercentage}%`;
    document.getElementById('m-action-rate').innerText = `${actionPercentage}%`;

    document.getElementById('unplannedList').innerHTML = unplannedListHtml || '<li class="doodle-list-item" style="color:var(--text-muted);">No unplanned scaledowns</li>';
    document.getElementById('scaleupList').innerHTML = scaleupListHtml || '<li class="doodle-list-item" style="color:var(--text-muted);">No scaleups pending</li>';
    document.getElementById('scaledownPendingList').innerHTML = scaledownPendingListHtml || '<li class="doodle-list-item" style="color:var(--text-muted);">No scaledowns pending</li>';

    document.getElementById('count-unplanned').innerText = countUnplanned;
    document.getElementById('count-scaleup').innerText = countScaleup;
    document.getElementById('count-scaledown-p').innerText = countScaledownP;

    document.getElementById('sellerTableBody').innerHTML = tableHtml || '<tr><td colspan="10" style="text-align:center;">No valid seller records found in sheet.</td></tr>';
  }

  function switchTab(tabId) {
    document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
    document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));

    document.getElementById(tabId).classList.remove('hidden');
    document.getElementById(`btn-${tabId}`).classList.add('active');
  }

  window.onload = function() {
    setAutoLastWeekDateRange();
    fetchDailyQuote();
    fetchCSVData();
  };
</script>
